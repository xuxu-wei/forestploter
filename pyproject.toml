[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forestploter"
version = "0.1.0rc1"
description = "Auditable XLSX/CSV-driven forest plots for Python with Matplotlib"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Xuxu Wei" },
]
maintainers = [
  { name = "Xuxu Wei" },
]
keywords = [
  "confidence-interval",
  "data-visualization",
  "forest-plot",
  "matplotlib",
  "meta-analysis",
  "scientific-visualization",
  "xlsx",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Visualization",
  "Typing :: Typed",
]
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "openpyxl>=3.1",
  "pandas>=2.0",
]

[project.optional-dependencies]
test = [
  "Pillow>=10",
  "pytest>=8",
  "pytest-cov>=5",
]
docs = [
  "myst-parser>=4",
  "numpydoc>=1.9",
  "sphinx>=8",
  "sphinx-intl>=2.2",
  "sphinx-rtd-theme>=3",
]
dev = [
  "build>=1.2",
  "check-manifest>=0.50",
  "check-wheel-contents>=0.6",
  "mypy>=1.13",
  "nox>=2024.10.9",
  "pandas-stubs>=2.2",
  "pip-audit>=2.7",
  "pre-commit>=4",
  "ruff>=0.9",
  "twine>=6",
]

[project.urls]
Homepage = "https://github.com/xuxu-wei/forestploter"
Documentation = "https://xuxu-wei.github.io/forestploter/"
Repository = "https://github.com/xuxu-wei/forestploter.git"
Issues = "https://github.com/xuxu-wei/forestploter/issues"
Changelog = "https://github.com/xuxu-wei/forestploter/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = true
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["forestploter*"]

[tool.setuptools.package-data]
forestploter = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
  "build",
  "dist",
  "docs/_build",
  "docs/api/generated",
  "tests/.cache",
]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["B011"]

[tool.mypy]
python_version = "3.12"
files = ["src/forestploter"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["forestploter"]

[tool.coverage.report]
show_missing = true
skip_covered = true
