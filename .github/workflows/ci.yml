name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/forestploter

  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q

  operating-system-smoke:
    name: ${{ matrix.os }} smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q

  package:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build check-manifest check-wheel-contents twine
      - run: check-manifest
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: check-wheel-contents dist
      - name: Verify wheel installation and rendering
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install dist/*.whl
          .wheel-smoke/bin/python scripts/release_smoke.py tests/data/01_single_series.xlsx --output-dir .wheel-smoke/output
      - name: Verify source distribution installation and rendering
        run: |
          python -m venv .sdist-smoke
          .sdist-smoke/bin/python -m pip install dist/*.tar.gz
          .sdist-smoke/bin/python scripts/release_smoke.py tests/data/01_single_series.xlsx --output-dir .sdist-smoke/output
      - uses: actions/upload-artifact@v7
        with:
          name: checked-distributions
          path: dist/
          if-no-files-found: error
